<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs - PLP ELMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    .page-header {
      background: var(--green-dark);
      color: white;
      padding: 60px 80px;
      text-align: center;
    }

    .page-header h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .program-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
      margin: 60px 0;
    }

    .program-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s;
    }

    .program-card:hover {
      transform: translateY(-10px);
    }

    .program-image {
      height: 200px;
      background: #e0e0e0;
    }

    .program-content {
      padding: 30px;
    }

    .program-type {
      font-size: 12px;
      font-weight: 700;
      color: var(--green-primary);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    .program-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--green-dark);
    }

    .program-link {
      color: var(--green-primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .program-link:after {
      content: ' →';
    }
  </style>
</head>
<body>

  <div id="header-component" data-active="program"></div>

  <header class="page-header">
    <h1>Academic Programs</h1>
    <p>Discover our wide range of undergraduate and graduate programs.</p>
  </header>

  <div class="container">
    <div class="program-grid">
      <div class="program-card">
        <div class="program-image" style="background: #e8f5e9 url('https://api.builder.io/api/v1/image/assets/TEMP/b454eca5272b45bd5163bb9547a7f4d29c2b4581') center/cover;"></div>
        <div class="program-content">
          <span class="program-type">College of Computer Studies</span>
          <h3 class="program-title">BS in Computer Science</h3>
          <p class="program-desc">Focus on software development, artificial intelligence, and data structures.</p>
          <a href="#" class="program-link">View Curriculum</a>
        </div>
      </div>
      <!-- Additional cards can be added here -->
    </div>
  </div>

  <div id="footer-component"></div>

  <script type="module" src="./components.js"></script>
</body>
</html>
