<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - PLP ELMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="dashboard-styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="https://api.builder.io/api/v1/image/assets/TEMP/dd3db7f4df3a24814cb1e712ad58474ebac6e0f9" alt="PLP Logo" class="sidebar-logo">
      <span class="sidebar-brand">PLP ELMS</span>
    </div>
    <nav class="nav-menu">
      <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
      <a href="dashboard-student.html" class="nav-item active"><span>📊</span> Dashboard</a>
      <a href="subject.html" class="nav-item"><span>📚</span> My Classes</a>
      <a href="#" class="nav-item"><span>📝</span> Assignments</a>
      <a href="#" class="nav-item"><span>📂</span> Materials</a>
    </nav>
    <div style="padding: 20px; border-top: 1px solid #f0f0f0;">
      <a href="login-student.html" class="nav-item" style="color: #e53935;"><span>🚪</span> Logout</a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" placeholder="Search for courses, materials, or people...">
      </div>
      <div class="header-actions">
        <div class="icon-btn">🔔</div>
        <div class="user-profile">
          <div class="user-avatar">JD</div>
          <div class="user-info">
            <div style="font-weight: 600; font-size: 14px;">John Doe</div>
            <div style="font-size: 12px; color: var(--text-muted);">Student</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-body">
      <section class="welcome-banner">
        <h2>Welcome back, John! 👋</h2>
        <p>You have 3 assignments due this week. Stay on track!</p>
      </section>

      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="font-size: 20px; font-weight: 700;">Active Courses</h3>
          <a href="#" style="color: var(--green-primary); font-size: 14px; font-weight: 600; text-decoration: none;">View All</a>
        </div>
        <div class="course-grid">
          <div class="course-card">
            <div class="course-thumb" style="background: #e8f5e9 url('https://api.builder.io/api/v1/image/assets/TEMP/b454eca5272b45bd5163bb9547a7f4d29c2b4581') center/cover;"></div>
            <div class="course-info">
              <span class="course-tag">COMPUTER SCIENCE</span>
              <h4 class="course-title">Introduction to Web Development</h4>
              <div class="course-meta">
                <span>👤 Prof. Smith</span>
                <span>📈 75% Complete</span>
              </div>
            </div>
          </div>
          <!-- More cards... -->
        </div>
      </section>
    </main>
  </div>

</body>
</html>
