<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professor Login - PLP ELMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <div id="header-component"></div>

  <main class="login-card">
    <div class="login-form-col">
      <div class="login-brand-header">
        <h1 class="brand-title">
          <span class="title-green">PLP </span><span class="title-yellow">ELECTRONIC LEARNING </span><span class="title-green">SYSTEM</span>
        </h1>
      </div>

      <p class="login-subtitle">Access your educator dashboard and manage your classes</p>

      <div class="login-body-row">
        <div class="login-role-selector">
          <a href="login-student.html" class="role-card">
            <div class="role-icon-box">
              <img class="role-icon" src="https://api.builder.io/api/v1/image/assets/TEMP/3a18d9ec8937af5b60962a9a37079870fcd5694a?width=294" alt="Student">
            </div>
            <span class="role-label">STUDENT</span>
          </a>
          <div class="role-card role-card--active">
            <div class="role-icon-box">
              <img class="role-icon" src="https://api.builder.io/api/v1/image/assets/TEMP/cc653d77a6b450e213254eae2a90738b95c0cd80?width=248" alt="Professor">
            </div>
            <span class="role-label">PROFESSOR</span>
          </div>
        </div>

        <form class="login-form">
          <div class="field-group">
            <label class="field-label">University Email</label>
            <input class="field-input" type="email" placeholder="name@plpasig.edu.ph" required>
          </div>
          <div class="field-group">
            <label class="field-label">Password</label>
            <input class="field-input" type="password" placeholder="Enter your password" required>
          </div>
          <button class="signin-btn" type="submit" style="background: var(--green-dark);">Educator Sign In</button>
        </form>
      </div>

      <div class="signup-prompt">
        <span>Don't have an account?</span>
        <a href="signup-professor.html" class="signup-now-link">Sign Up Now</a>
      </div>
    </div>

    <div class="login-photo-col">
      <img class="login-photo" src="https://api.builder.io/api/v1/image/assets/TEMP/b454eca5272b45bd5163bb9547a7f4d29c2b4581?width=1758" alt="PLP Campus">
      <div class="login-photo-tint"></div>
    </div>
  </main>

  <div id="footer-component"></div>

  <script type="module" src="./components.js"></script>
</body>
</html>
