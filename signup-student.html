<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLP ELMS - Sign Up as Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="signup-page">

  <div class="bg-blob bg-blob--top-left"></div>
  <div class="bg-blob bg-blob--bottom-right"></div>

  <main class="main-card">

    <!-- Left: Campus Photo -->
    <div class="campus-photo-col">
      <img
        class="campus-photo"
        src="https://api.builder.io/api/v1/image/assets/TEMP/b454eca5272b45bd5163bb9547a7f4d29c2b4581?width=1758"
        alt="Pamantasan ng Lungsod ng Pasig campus"
      />
      <div class="campus-photo-tint"></div>
    </div>

    <!-- Right: Form Area -->
    <div class="form-col">

      <!-- Brand Header -->
      <div class="brand-header">
        <a href="https://plpasig.edu.ph/" target="_blank" rel="noopener noreferrer">
          <img
            class="plp-logo"
            src="https://api.builder.io/api/v1/image/assets/TEMP/dd3db7f4df3a24814cb1e712ad58474ebac6e0f9?width=332"
            alt="PLP Logo"
          />
        </a>
        <h1 class="brand-title">
          <span class="title-green">PLP </span><span class="title-yellow">ELECTRONIC LEARNING<br />MANAGEMENT </span><span class="title-green">SYSTEM</span>
        </h1>
      </div>

      <p class="signup-subtitle">Sign up to continue</p>

      <!-- Form + Role Selector Row -->
      <div class="form-and-roles">

        <form class="register-form" action="#" method="post">
          <div class="field-group">
            <label class="field-label" for="name">Name (Last Name, First Name, Middle Initial)</label>
            <input class="field-input" type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" />
          </div>

          <div class="field-group">
            <label class="field-label" for="email">Email Address</label>
            <input class="field-input" type="email" id="email" name="email" placeholder="johndoe@plpasig.edu.ph" autocomplete="email" />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" />
          </div>

          <div class="field-group">
            <label class="field-label" for="repeat-password">Repeat Password</label>
            <input class="field-input" type="password" id="repeat-password" name="repeat-password" placeholder="Repeat Password" autocomplete="new-password" />
          </div>

          <button class="register-btn" type="submit">Register as Student</button>
        </form>

        <!-- Role Selector -->
        <div class="role-selector">
          <a href="/signup-student.html" class="role-card role-card--active" aria-label="Sign up as Student">
            <div class="role-icon-box">
              <img
                class="role-icon"
                src="https://api.builder.io/api/v1/image/assets/TEMP/3a18d9ec8937af5b60962a9a37079870fcd5694a?width=294"
                alt="Student"
              />
            </div>
            <span class="role-label">STUDENT</span>
          </a>

          <a href="/index.html" class="role-card" aria-label="Sign up as Professor">
            <div class="role-icon-box">
              <img
                class="role-icon"
                src="https://api.builder.io/api/v1/image/assets/TEMP/cc653d77a6b450e213254eae2a90738b95c0cd80?width=248"
                alt="Professor"
              />
            </div>
            <span class="role-label">PROFESSOR</span>
          </a>
        </div>

      </div>

      <!-- Or Divider -->
      <div class="or-divider">
        <span class="divider-line"></span>
        <span class="divider-text">Or</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google Sign Up -->
      <div class="google-signup">
        <p class="google-label">Sign up with Google</p>
        <button class="google-btn" type="button" aria-label="Sign up with Google">
          <svg width="40" height="40" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.1 0 5.7 1.1 7.8 2.9l5.8-5.8C33.9 3.5 29.3 1.5 24 1.5 14.9 1.5 7.1 7 3.5 14.8l6.8 5.3C12.1 13.6 17.5 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7C43.3 36.5 46.5 30.8 46.5 24z"/>
            <path fill="#FBBC05" d="M10.3 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6L3.5 14c-1.3 2.6-2 5.5-2 8.5s.7 5.9 2 8.5l6.8-5.4z"/>
            <path fill="#34A853" d="M24 46.5c5.5 0 10.1-1.8 13.5-4.9l-7.4-5.7c-1.8 1.2-4.1 2-6.1 2-6.5 0-12-4.1-13.7-9.8l-6.8 5.3C7.1 41 14.9 46.5 24 46.5z"/>
          </svg>
        </button>
      </div>

      <!-- Sign In Link -->
      <div class="signin-prompt">
        <span class="signin-text">Already have an account?</span>
        <a href="/login-student.html" class="signin-link">Sign In Now</a>
      </div>

    </div>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
